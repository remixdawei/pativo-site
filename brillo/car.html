<script>
(() => {
const T = 4.8, WHEELS = [170, 530], WY = 696, R = 74, PC = [350, 696], PIPE = [22, 687], GROUND = 770;
const HPIV = [300, 360], LEG = [[412, 426], [494, 418]], HINGE = [404, 286], EYE = [350, 228], NP = {"h": [[261.9, 299.4], [261.5, 294.7], [261.3, 289.9], [261.2, 284.9], [261.2, 279.8], [261.4, 274.6], [261.7, 269.3]], "b": [[180.0, 439.9], [180.5, 436.9], [181.1, 433.6], [181.7, 430.3], [182.4, 427.0], [183.1, 423.8], [183.9, 420.5], [184.7, 417.3], [185.6, 414.1], [186.5, 410.9], [187.5, 407.7], [188.6, 404.5], [189.7, 401.4], [190.8, 398.2], [192.0, 395.1], [193.3, 392.0], [194.6, 389.0], [196.0, 386.0], [197.5, 383.0], [199.0, 380.0], [200.5, 377.4], [202.0, 374.8], [203.6, 372.2], [205.2, 369.7], [207.0, 367.2], [208.7, 364.7], [210.6, 362.2], [212.5, 359.8], [214.6, 357.4], [216.7, 355.0], [219.0, 352.6], [221.3, 350.3], [223.8, 348.1], [226.4, 345.9], [228.8, 344.1], [231.3, 342.2], [233.9, 340.4], [236.6, 338.6], [239.5, 336.9], [242.2, 335.5]], "R": 60, "c0": [170, 340]}, TM = {"jumps": [{"launch": 0.5, "air": 0.7, "hop": 90, "pitch": 12, "dip": 12, "pre": 14, "pitchLand": 1.2, "shout": 1.0}, {"launch": 2.9, "air": 0.56, "hop": 52, "pitch": 7, "dip": 8, "pre": 9, "pitchLand": 0.8, "shout": 0.35}], "blinks": [1.26, 1.46, 2.35, 3.62, 4.35], "blinkD": 0.08, "puffs": [0.32, 0.52, 1.22, 2.72, 2.92, 3.42], "puffR": [18, 26, 26, 12, 18, 18], "puffLife": 0.85, "dust": [1.2, 3.46], "dustR": [22, 15], "dustLife": 0.7, "drops": 1.2, "still": 0.85}, BGS = {"purple": {"bg": "#CB98F4", "pa": "#DCC0F8", "pb": "#BF8BF0", "shadow": "#7E44C4", "so": 0.6, "puff": "#F4EEFA", "dust": "#F4EEFA"}, "warm": {"bg": "#F3F0EA", "pa": "#EAE5DB", "pb": "#E1DBCF", "shadow": "#000000", "so": 0.1, "puff": "#C9CFD3", "dust": "#C9C2B4"}, "none": {"bg": null, "pa": null, "pb": null, "shadow": "#000000", "so": 0.1, "puff": "#C9CFD3", "dust": "#C9CFD3"}};
const $ = id => document.getElementById(id);
const E = {car: $('car'), chassis: $('chassis'), shell: $('shell'), bril: $('brilG'), brilBody: $('brilBody'), nape: $('nape'), head: $('bHead'), leg: $('leg'),
  eyeO: $('eyeO'), eyeC: $('eyeC'), pupil: $('pupilR'), look: $('lookR'), low: $('bkLow'), up: $('bkUp'), mouth: $('mouthIn'),
  rim: [$('rim0'), $('rim1')], pillA: $('pillA'), pillB: $('pillB'), wind: $('wind'), shadow: $('shadow'),
  drops: [...document.querySelectorAll('.drop')], puffs: [...$('puffs').children], dust: [...$('dust').children], cv: $('cv')};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mod = (x, m) => { const r = x % m; return r < 0 ? r + m : r; };
const ss = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
const pulse = (t, t0, up, hold, down) => ss(t0, t0 + up, t) * (1 - ss(t0 + up + hold, t0 + up + hold + down, t));
const bell = v => (v <= 0 || v >= 1) ? 0 : Math.pow(Math.sin(Math.PI * v), 1.3);
const RAD = Math.PI / 180, AXLE = PC[0] - WHEELS[0];
// 落地弹簧：先往下压、再弹回、再小小地回弹，然后停住（阻尼振荡，峰值归一到 ±1；阻尼比 0.42，回弹两下就停）
const WL = 2 * Math.PI * 2.6, ZL = .42, WD = WL * Math.sqrt(1 - ZL * ZL);
const rawL = tau => Math.exp(-ZL * WL * tau) * Math.sin(WD * tau);
let LM = 0; for (let i = 0; i < 600; i++) LM = Math.max(LM, Math.abs(rawL(i / 1000)));
const landS = tau => rawL(tau) / LM;

// 车的状态：整车高度 z（向上为正）、车头翘起的角度 p（度，正 = 车头往上）、车身相对轮子下沉 d、落地车头压下去 pl（只给车壳，轮子不动）、整体高度 zc
function carState(t) {
  t = mod(t, T);
  let z = 0, p = 0, d = 0, pl = 0, stretch = 0, quiet = 0, shout = 0, clench = 0, land = 0;
  for (const J of TM.jumps) {
    const TLj = J.launch, TLd = TLj + J.air, u = (t - TLj) / J.air, tau = mod(t - TLd, T);
    if (u >= 0 && u < 1) { z += J.hop * 4 * u * (1 - u); p += J.pitch * ss(0, .16, t - TLj) * (1 - Math.pow(u, 2.4)); }   // 起跳后 0.16 秒内车头翘起来，落地前慢慢放平
    const down = ss(TLj - .28, TLj - .10, t), up = Math.pow(clamp((t - (TLj - .06)) / .06, 0, 1), 2);
    d += -J.dip * landS(tau) - J.pre * down * (1 - up) + J.pre * .29 * bell((t - (TLj - .05)) / .2);   // 慢慢蹲下、停一下、很快加速放开、再多伸一点；落地压下去
    pl += -J.pitchLand * landS(tau);                                                                 // 落地时车头先“啪”地压下去一点
    stretch += .03 * (J.hop / 90) * bell((t - (TLj - .05)) / .2);                                    // 起跳那一下车身微微拉长
    quiet += ss(TLj - .05, TLj, t) - ss(TLd + .45, TLd + .8, t);                                     // 起跳前到落地后 0.45–0.8 秒不抖
    shout += J.shout * pulse(t, TLj - .04, .08, J.air - .08, .10);
    clench += J.shout * pulse(t, TLd - .02, .03, .10, .10);
    land += pulse(t, TLd, .03, .05, .2);
  }
  const lift = AXLE * Math.sin(Math.abs(p) * RAD);                            // 空中翘头时 z 一直比它大；这里只是保险
  z = Math.max(z, lift);
  const calm = clamp(1 - quiet, 0, 1);
  d += .8 * Math.sin(2 * Math.PI * 48 * t / T) * calm;                        // 平路上发动机轻轻抖（10 赫兹）
  return {z, p, d, pl, zc: z + d, calm, stretch, shout: clamp(shout, 0, 1), clench: clamp(clench, 0, 1), land: clamp(land, 0, 1)};
}
// Brillo 在座位上比车晚一点被颠起（弹簧跟随），头再晚一点点头
const NS = Math.round(T * 240), SB = new Float32Array(NS), SHD = new Float32Array(NS);
(function simulate() {
  const dt = 1 / 2400, steps = Math.round(T / dt), w = f => 2 * Math.PI * f;
  const kB = w(2.1) ** 2, cB = 2 * .6 * w(2.1), kH = w(2.2) ** 2, cH = 2 * .55 * w(2.2);   // Brillo 比车的落地弹簧（2.6 赫兹）慢一点，才是“晚一点跟着”
  let y = carState(0).zc, yv = 0, h = y, hv = 0, zp = y;
  for (let loop = 0; loop < 4; loop++) for (let s = 0; s < steps; s++) {
    const t = s * dt, zc = carState(t).zc, zv = (zc - zp) / dt; zp = zc;
    const ya = -kB * (y - zc) - cB * (yv - zv); yv += ya * dt; y += yv * dt;
    const ha = -kH * (h - y) - cH * (hv - yv); hv += ha * dt; h += hv * dt;
    if (loop === 3 && s % 10 === 0) { const k = s / 10; if (k < NS) { SB[k] = y - zc; SHD[k] = y - h; } }
  }
})();
const sim = (a, t) => { const x = mod(t, T) / T * NS, i = Math.floor(x), f = x - i; return a[i % NS] * (1 - f) + a[(i + 1) % NS] * f; };
function carPt(t, x, y) {   // 车身坐标里的一点，在第 t 秒的实际位置（排气管跟着车身跳）
  const S = carState(t), a = -S.p * RAD, dx = x - PC[0], dy = y - PC[1];
  return [PC[0] + dx * Math.cos(a) - dy * Math.sin(a), PC[1] + dx * Math.sin(a) + dy * Math.cos(a) - S.z - S.d];
}
// 后脖子圆角（和 ../car 一样：头转、身体呼吸时圆角每帧重算）
function nearSeg(P, cx, cy) { let bd = 1e9, bx = 0, by = 0;
  for (let i = 0; i < P.length - 1; i++) { const ax = P[i][0], ay = P[i][1], ex = P[i + 1][0] - ax, ey = P[i + 1][1] - ay;
    const u = clamp(((cx - ax) * ex + (cy - ay) * ey) / (ex * ex + ey * ey), 0, 1), qx = ax + ex * u, qy = ay + ey * u, d = Math.hypot(cx - qx, cy - qy);
    if (d < bd) { bd = d; bx = qx; by = qy; } }
  return [bd, bx, by]; }
function napePath(hr, sx, sy) {
  const a = hr * RAD, co = Math.cos(a), si = Math.sin(a), Rr = NP.R;
  const rot = (x, y) => [300 + (x - 300) * co - (y - 360) * si, 360 + (x - 300) * si + (y - 360) * co];
  const hp = NP.h.map(([x, y]) => rot(x, y)), bp = NP.b.map(([x, y]) => [300 + (x - 300) * sx, 470 + (y - 470) * sy]);
  let cx = NP.c0[0], cy = NP.c0[1];
  for (let k = 0; k < 30; k++) { const [dh, hx, hy] = nearSeg(hp, cx, cy), [db, bx, by] = nearSeg(bp, cx, cy);
    cx += .6 * ((Rr - dh) * (cx - hx) / dh + (Rr - db) * (cx - bx) / db); cy += .6 * ((Rr - dh) * (cy - hy) / dh + (Rr - db) * (cy - by) / db); }
  const [, hx, hy] = nearSeg(hp, cx, cy), [, bx, by] = nearSeg(bp, cx, cy), [ix, iy] = rot(250, 330);
  return `M${hx.toFixed(2)},${hy.toFixed(2)} A${Rr},${Rr} 0 0 1 ${bx.toFixed(2)},${by.toFixed(2)} L250,430 L${ix.toFixed(2)},${iy.toFixed(2)} Z`;
}

const PUFF = [[0, 0, 1], [-1, 0.32, 0.68], [0.95, 0.4, 0.6]], DUST = [[0, 0, 1], [-1.15, 0.35, 0.65], [1.1, 0.4, 0.6]];
let bg = BGS.purple, bgName = 'purple';
const ROT_LOOP = 1200;   // 轮子 3 个孔（120° 对称）：一个循环转 1200°，头尾接得上
function cloud(g, cx, cy, Rm, SHP) { [...g.children].forEach((c, j) => { const [dx, dy, rr] = SHP[j];
  c.setAttribute('cx', (cx + dx * Rm).toFixed(1)); c.setAttribute('cy', (cy + dy * Rm).toFixed(1)); c.setAttribute('r', (Rm * rr).toFixed(1)); }); }
function at(t) {
  t = mod(t, T);
  const S = carState(t), b = sim(SB, t), hn = sim(SHD, t), breathe = Math.sin(2 * Math.PI * 4 * t / T);
  // 背景：小药丸往后飘（两层速度不同）；影子随高度变小变淡
  E.pillA.setAttribute('transform', `translate(${(-mod(300 * t, 720) - 150).toFixed(1)},0)`);
  E.pillB.setAttribute('transform', `translate(${(-mod(150 * t, 360) - 150).toFixed(1)},0)`);
  const hf = clamp(S.z / TM.jumps[0].hop, 0, 1.3);
  E.shadow.setAttribute('rx', (330 * (1 - .12 * hf)).toFixed(1)); E.shadow.setAttribute('opacity', (bg.so * (1 - .12 * hf)).toFixed(3)); E.shadow.setAttribute('cy', (GROUND + 8 + 28 * hf).toFixed(1));   // 落地时贴着轮底，越高离得越远（封面：车在空中，影子在很下面）
  // 车：整体跳 + 车头翘起（绕两轴中间转）；车身压扁 / 拉长只给车壳，Brillo 不变形
  E.car.setAttribute('transform', `translate(0,${(-S.z).toFixed(2)}) rotate(${(-S.p).toFixed(3)} ${PC[0]} ${PC[1]})`);
  E.chassis.setAttribute('transform', `translate(0,${(-S.d).toFixed(2)}) rotate(${(-S.pl).toFixed(3)} ${PC[0]} ${PC[1]})`);
  const sy = 1 + S.d * .0022 + S.stretch, sx = 1 - (sy - 1) * .6;
  E.shell.setAttribute('transform', `translate(${PC[0]},${WY}) scale(${sx.toFixed(4)},${sy.toFixed(4)}) translate(${-PC[0]},${-WY})`);
  const rot = ROT_LOOP * t / T;
  E.rim.forEach((r, i) => r.setAttribute('transform', `rotate(${rot.toFixed(2)} ${WHEELS[i]} ${WY})`));
  // Brillo：晚一点被颠起；翅尖一直搭在方向盘上
  E.bril.setAttribute('transform', `translate(0,${(-b).toFixed(2)})`);
  E.brilBody.setAttribute('transform', `translate(300,470) scale(${(1 + .008 * breathe).toFixed(4)},${(1 + .016 * breathe).toFixed(4)}) translate(-300,-470)`);
  // 一只脚抓着方向盘：脚掌不动，腿根跟着 Brillo 上下，腿一直连着脚
  { const [bs, fp] = LEG, bx = bs[0], by = bs[1] - b, mx = (bx + fp[0]) / 2 - 10, my = (by + fp[1]) / 2 + 6;
    E.leg.setAttribute('d', `M${bx},${by.toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${fp[0] - 4},${fp[1] + 2}`); }
  // 表情：起跳到落地喊出声（喙张大、头往后仰一点）；平时喙微张；落地时咬紧；瞳孔一直缩得小小的、微微抖；落地连眨两下
  const shout = S.shout, clench = S.clench;
  const bk = clamp(.16 + .62 * shout - .16 * clench, 0, 1);
  const hr = clamp(.24 * hn, -8, 8) + .8 * S.p - 4 * shout;
  E.head.setAttribute('transform', `rotate(${hr.toFixed(2)} ${HPIV[0]} ${HPIV[1]})`);
  if (NP) E.nape.setAttribute('d', napePath(+hr.toFixed(2), +(1 + .008 * breathe).toFixed(4), +(1 + .016 * breathe).toFixed(4)));
  E.low.setAttribute('transform', `rotate(${(24 * bk).toFixed(2)} ${HINGE[0]} ${HINGE[1]})`);
  E.up.setAttribute('transform', `rotate(${(-5 * bk).toFixed(2)} ${HINGE[0]} ${HINGE[1] - 50})`);
  E.mouth.setAttribute('opacity', bk > .04 ? 1 : 0);
  let closed = false; TM.blinks.forEach(t0 => { const dd = t - t0; if (dd >= 0 && dd < TM.blinkD) closed = true; });
  E.eyeO.setAttribute('opacity', closed ? 0 : 1); E.eyeC.setAttribute('opacity', closed ? 1 : 0);
  const pin = clamp(.62 + .05 * Math.sin(2 * Math.PI * 24 * t / T) - .12 * shout + .22 * S.land, .3, 1);
  const px = EYE[0] + 7, py = EYE[1] + 2;
  E.pupil.setAttribute('transform', `translate(${px},${py}) scale(${pin.toFixed(3)}) translate(${-px},${-py})`);
  E.look.setAttribute('transform', `translate(${(3 + 2 * shout).toFixed(2)},${(2 - 4 * shout).toFixed(2)})`);
  // 汗珠：两颗轮流从头顶后面冒出来、往后上方甩出去、缩没（不透明，靠大小出现和消失）
  E.drops.forEach((g, k) => { const ph = mod(t / TM.drops + k / 2, 1), s = ss(0, .18, ph) * (1 - ss(.62, .86, ph));
    const x = (k ? 262 : 232) - 100 * ph, y = (k ? 150 : 190) - 60 * ph + 70 * ph * ph;
    g.setAttribute('opacity', s > .02 ? 1 : 0); g.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(1.35 * s).toFixed(3)}) rotate(${(18 + 30 * ph).toFixed(1)})`); });
  // 尾气：起跳、落地时多冒一团，从排气管口长出来，往后飘、变大、缩没
  E.puffs.forEach((g, k) => { const tb = TM.puffs[k], age = mod(t - tb, T);
    if (age > TM.puffLife) { g.setAttribute('opacity', 0); return; }
    const u = age / TM.puffLife, [x0, y0] = carPt(tb, PIPE[0], PIPE[1]);
    const Rm = TM.puffR[k] * ss(0, .22, u) ** .7 * (1 - ss(.6, 1, u));
    cloud(g, x0 - .55 * Rm - 140 * age, y0 - 4 - 34 * ss(0, 1, u), Rm, PUFF);
    g.setAttribute('fill', bg.puff); g.setAttribute('opacity', Rm > 2.5 ? 1 : 0); });
  // 落地的灰尘：后轮、前轮各一团，留在原地往后退
  E.dust.forEach((g, k) => { const tb = TM.dust[Math.floor(k / 2)], age = mod(t - tb, T);
    if (age > TM.dustLife) { g.setAttribute('opacity', 0); return; }
    const u = age / TM.dustLife, x0 = k % 2 ? WHEELS[1] + R + 6 : WHEELS[0] - R - 6;
    const Rm = TM.dustR[Math.floor(k / 2)] * ss(0, .25, u) ** .7 * (1 - ss(.55, 1, u));
    cloud(g, x0 - 200 * age, GROUND - 22 - 20 * ss(0, 1, u), Rm, DUST);
    g.setAttribute('fill', bg.dust); g.setAttribute('opacity', Rm > 2.5 ? 1 : 0); });
}

function setBg(k) {
  bgName = k; bg = BGS[k]; const on = k !== 'none';
  document.body.style.background = bg.bg || 'transparent';
  E.wind.style.display = on ? '' : 'none';
  E.pillA.parentNode.setAttribute('fill', bg.pa || '#000'); E.pillB.parentNode.setAttribute('fill', bg.pb || '#000');
  E.shadow.setAttribute('fill', bg.shadow);
  document.querySelectorAll('#ui [data-bg]').forEach(b => b.classList.toggle('on', b.dataset.bg === k));
}
let raf = 0, t0 = null, paused = false, tp = 0;
function frame(now) { if (t0 === null) t0 = now - tp * 1000; tp = (now - t0) / 1000; at(tp); raf = requestAnimationFrame(frame); }
function play() { paused = false; t0 = null; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); $('pp').textContent = '暂停'; }
function pause() { paused = true; cancelAnimationFrame(raf); raf = 0; $('pp').textContent = '播放'; }
document.querySelectorAll('#ui [data-bg]').forEach(b => b.onclick = () => { setBg(b.dataset.bg); if (paused) at(tp); });
$('pp').onclick = () => paused ? play() : pause();
// 网址参数：#bg=purple|warm|none  #ui=0（隐藏按钮）  #t=2.3（定格在第几秒，截图用）
const q = new URLSearchParams(location.hash.slice(1));
if (q.get('ui') === '0') $('ui').style.display = 'none';
setBg(BGS[q.get('bg')] ? q.get('bg') : 'purple');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (q.has('t')) { tp = +q.get('t'); at(tp); pause(); }
else if (reduce) { tp = TM.still; at(tp); pause(); }      // 系统开了“减少动态”：停在跳到最高点的那个画面
else play();
window.BrilloCarCover = {T, at, setBg, play, pause, state: carState};
})();
</script></body></html>
