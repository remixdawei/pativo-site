const tf=(id,v)=>$(id).setAttribute('transform',v), vis=(id,on)=>$(id).setAttribute('opacity',on?1:0);

// ———— 运行时：状态机 + 控制接口 ————
const MOODS=['idle','walk','dance','talk'], ONCE=['correct','wrong'];
ST.talk=ST.sing;   // 对外叫 talk（说话），动作定义里叫 sing

function frame(now){ raf=0; last=poseNow(now); apply(last); if(!document.hidden&&!(reduce.matches&&!TL[state])) raf=requestAnimationFrame(frame) }

kick(); send({event:'ready'});
